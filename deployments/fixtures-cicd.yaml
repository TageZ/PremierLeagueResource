name: Build & Package Lambda

on:
  push:
    branches:
      - main

jobs:
  build-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Copy Handler to Root
        run: cp dist/fixtures.js fixtures.js

      - name: Prune to Production Dependencies
        run: npm prune --production

      - name: Zip Lambda Files
        run: zip -r lambda.zip fixtures.js node_modules package.json      
        
      - name: Deploy to AWS Lambda
        uses: appleboy/lambda-action@v0.1.5
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region: ${{ secrets.AWS_REGION }}
          function_name: ${{ secrets.LAMBDA_FUNCTION_NAME }}
          zip_file: lambda.zip
          handler: fixtures.handler
          runtime: nodejs18.x

